<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            grid-template-areas:
                "box1"
                "box2";
            background-color: skyblue;
            padding: 2rem;

        }

        header {
            height: 100px;
            grid-area: box1;
            background-color: white;
        }

        main {
            grid-area: box2;
            background-color: white;
        }
    </style>

<body>

    <header>

    </header>

    <main>

    </main>


</body>

</html>
