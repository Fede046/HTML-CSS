<!DOCTYPE html>
<html>
	<head>
		<meta charest='UTF-9'>
		<meta name='viweport' content='width=device-width,initial-scale=1'>
		<title>Pres</title>
		<style>
			*{
				margin:0;
				padding: 0;
				box-sizing: border-box;
			}
			a:hover{
				color: red;
			}
			
			nav a{
				text-decoration: none;
			}
			nav{
				height: 10vh;
				width: 100%;
				border-bottom: 2px solid black;
				display: grid;
				grid-template-columns: 1fr 10fr 10fr;
				gap: 1rem;
				padding: 1rem;
			}
			nav div{
				height: 100%;
				width: 100%;
				position: relative;
			}
			nav img{
				position: absolute;
				height: 100%;
				width: 100%;
				
			}
			nav ul{
				display: flex;
				gap: 1rem;
				align-items: center;
				list-style: none;
			}
			nav ul:nth-child(3){
				justify-content: right;
			}
			img{
				background-color: red;	
			}
			main{
				display: grid;
				grid-template-columns: 1fr 1fr;
				height: 80vh;
				width: 100%;
				gap: 1rem;
			}
			section{
				height: 100%;
				width: 100%;
			}
			section:nth-child(1){
				display: flex;	
			}
			#container{
				display: flex;	
				height: 100%;
				width: 20%;
				flex-direction: column;
				gap: 1rem;
				padding: 1rem;
			}
			section > div{
				width: 80%;
				height: 100%;
				position: relative;
			}
			#container div{
				height:10%;
				width:100%;
				position: relative;
			}
			img{
				position: absolute;
				height: 100%;
				width: 100%;	
			}
			
			section:nth-child(2){
				display: flex;
				flex-direction: column;
				gap: 1rem;
				height: 100%;
				width:100%;
				padding: 1rem;
			}
			#add{
				background-color: black;
				color: white;
				height: 4rem;
			}
			button{
				position: inline;	
			}
			button:hover,#add:hover{
				background-color: red;	
			}
			#add:active{
				background-color: blue;	
			}
			
			
		</style>
		
	</head>
	<body>
		<nav>
			<div>
				<img src='faccia.jpeg'>
			</div>
			<ul>
				<li><a href=''>Woman</a></li>
				<li><a href=''>Men</a></li>
				<li><a href=''>Holiday Shop</a></li>
				<li><a href=''>Magazine</a></li>
				<li><a href=''>Sustainebility</a></li>
			</ul>
			<ul>
				<li><a href=''>Search</a></li>
				<li><a href=''>My Account</a></li>
				<li><a href=''>Shopping: in ita</a></li>
			</ul>
		</nav>
		
		<p>HOME/SHIRTS/CAMICIA</p>
		
		<main>
			<section>
					<div id='container'>
				
						<div>
							<img class='lato' onClick='principale(0)' class='' src='faccia.jpeg'>
						</div>
					
						<div>
							<img class='lato' onClick='principale(1)' src='faccia.jpeg'>
						</div>
					
						<div>
							<img class='lato' onClick='principale(2)'src='faccia.jpeg'>
						</div>
					
						<div>
							<img class='lato' onClick='principale(3)'src='faccia.jpeg'>
						</div>
					
						<div>
							<img class='lato' onClick='principale(4)' src='faccia.jpeg'>
						</div>
					
						<div>
							<img class='lato' onClick='principale(5)' src='faccia.jpeg'>
						</div>
					
						<div>
							<img class='lato' onClick='principale(6)' src='faccia.jpg'>
						</div>
				</div>	
				
				<div>
					<img id='princ' src='faccia.jpeg'>
				</div>
				
			
			</section>
			
			<section>
				<h1>Camicia elegante</h1>
				<h1>33,33$</h1>
				<p>TommyJeans</p>
				<p>Color</p>
				<select>
					<option>Blue</option>
					<option>Red</option>
				</select>
				<p>EU size</p>
				
					<button>XL</button>
					<button>M</button>
					<button>L</button>
				
				<a href=''> Finde your size</a>
				<button id='add'>Add to bag</button>
			</section>
			
		</main>
		<script>
			
			
		
		
			function principale(num){
				const myImg = document.getElementsByClassName('lato')[num];		
				const prinImg = document.getElementById('princ');
				
				let temp = myImg.src;
				myImg.src = prinImg.src;
				prinImg.src = temp;
				
			}
			
		</script>
	</body>

</html>
