<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Doc</title>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            body{
                display: flex;
                
                flex-direction: column;
                background-color:gray;
                align-items: center;
            }
            nav{
                background-color: red;
                height: 50px;
                position: fixed;
                width:65vw;
                display: flex;
                justify-content: space-between;
                overflow: auto;
                z-index:10;
            }
            nav img{
                padding: 1rem;
                height: 100%;
                width: 40%;
            }
            nav ul{
                width: 40%;
                display: flex;
                align-items: center;
                list-style:none;
                gap: 1rem;
                font-size: 1rem;
            }
            a{
                text-decoration:none;
                color: black;
            }
            a:hover{
                color: skyblue;
            }
            /*--------------*/
            hero{
                width:65vw;
                padding: 1rem;
                margin-top:50px;
                text-align: center;
                background-color:green;
            }
            hero p{
                font-family: 'Georgia';
            }
            /*---------------*/
            main{
                width:65%;
                background-color:rgb(190, 190, 154);
                padding:1rem;
            }
            main label{
                border-bottom:1px solid black;
                display:flex;
                justify-content: space-between;
                width:100%;
            }
            /*---------------*/
            main ul{
                overflow:auto;
                display:flex;
                gap:1rem;
                padding:1rem;
                 
            }
            main ul >div{
                border:2px solid transparent;
                height:300px;
                width:50%;
                background-color:gray;
                transition: all 0.3s;
                display: flex;
                flex-direction: column;
                flex-shrink:0;
            }
            main ul >div:hover{
                border: 2px solid white;
            }
            main ul div img{
                width:100%;
                height: 80%;
            } 
            main ul div  h1{
                font-size:1rem;
                padding:0.5rem;
                height:10%;
            }
            footer{
                background-color:black;
                color:white;
                height:10%;
                display:flex;
                padding:0.3rem;
                align-items: center;
                justify-content:space-between;
            }

            /*-------------*/
            @media(max-width:768px){
                main ul{
                    flex-direction:column;
                }
                main ul >div{
                    width:100%;
                }
                nav{
                    display:none;
                }
                hero{
                    margin-top:0;
                }
            }

            

        </style>
    </head>
    <body>
        <nav>
            <img src="img/logo.png">

        </nav>

        </hero>

            <label>
                <span>New on Letterboxd</span>

            </label>

                    </footer>
                    
                </div>
                <div>

                    <footer>
                        <span>☆☆☆☆☆</span>
                        <span>12-12-2004</span>
                    </footer>
                    
                </div>
                <div>

                        <span>☆☆☆☆☆</span>

    </body>
</html>
