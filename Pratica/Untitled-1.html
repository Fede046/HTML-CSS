<!DOCTYPE html>
<html>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width,initial-scale=1'>
		<title>Sito</title>
		<style>
			*{
				margin:0;
				padding:0;
				box-sizing:border-box;
			}
			
			/*-----------------*/
			body{
				background-color: gray;
				font-family: Georgia;
			}
			nav{
				display: grid;
				padding: 1rem;
				height: 5rem;
				grid-template-columns: 1fr 3fr;
				grid-template-rows: 1fr;
				width: 100%;
				background-color: black;
				position: relative;
				color: white;
			}
			nav ul{

				display: flex;
				justify-content: space-between;
				list-style: none;
				align-items: center;
			}
			li a:hover{
				color: orange;
			}
			nav div{
				width: 100%;
				height: 100%;
				position: relative;
			}
			nav img{
				position: absolute;
				height: 100%;
				width: 100%;
			}
			/*-------------*/
			
			main{
				background-color: orange;
				width: 100%;
				height: 50vh;
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
				grid-template-areas: 'b1 b2''b3 b3';
				gap: 1rem;
				padding: 1rem;
			}
			section{
				background-color: white;
				display: flex;
				flex-direction: column;
				position: relative;
			}
		
			section:nth-child(1) img{
				position: absolute;
				width: 100%;
				height: 100%;
			}
			section:nth-child(1){
				text-align: center;	
				justify-content: center;
			}
			
			/*-------------------*/
			section:nth-child(2) img{
				
				width: 100%;
				height: 100%;
			}
			section:nth-child(2){
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr;
				
			}
			section:nth-child(2) div{
				display: flex;
				align-items: center;
				text-align: center;	
				justify-content: center;
			}
			/*-------------------*/
			section:nth-child(3) img{
				position: absolute;
				width: 100%;
				height: 100%;
			}
			section:nth-child(3){
				position: relative;
				width: 100%;
				height: 100%;
				justify-content: end;
			}
			section:nth-child(3) div{
				display: flex;
				align-items: center;
				text-align: center;	
				justify-content: center;
				background-color: pink;
				z-index: 2;
				height: 50%;
			}
			/*---------------*/
			
			footer{
				padding: 1rem;
				height: 5rem;
				align-items: center;
				display: flex;
				flex-direction: column;
				gap: 1rem;
				width: 100%;
				background-color: skyblue;
			}
			
			
		</style>
	<head>
	
	<body>
		<nav>
			<div>
				<img src='sigillo.png'>
			</div>
			
			<ul>
				<li><a href=''>Profilo</a></li>
				<li><a href=''>Negozio</a></li>
				<li><a href=''>Home</a></li>
			</ul>
		</nav>
		
		<main>
			<section style='grid-area: b1'>
				<img src='sigillo.png'>
				<div>
					<p>testo sopra a immagine con immagine come sfondo<p>
				</div>
			</section>
			
			<section style='grid-area: b2'>
				<img src='sigillo.png'>
				<div>
					<p>Immagine 50 testo 50<p>
				</div>
			</section>
			
			<section style='grid-area: b3'>
				<img src='sigillo.png'>
				<div>
					<p>Testo in un riquadro sotto bianco tipo tendina<p>
				</div>
			</section>
			
		</main>
		
		<footer>
			<p> Protetto da copyright</p>
			<p> Visita il sito <span><a href=''>www.sito.it</a></span></p>
		</footer>
	
	
	
	</body>
</html>
